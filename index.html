<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Paswurdium</title>
  </head>
  <body id="body">
    <div id="main">
      <h1>Paswurdium</h1>
      <p class="note">
        <strong>Note:</strong> This public version of Paswurdium only knows a
        limited set of words. I highly recommend creating your own word buckets
        to increase the variety of generated passwords.
      </p>
      <form id="passwordForm">
        <label for="numberOfPasswords"
          >Number of Passwords:
          <input
            type="number"
            id="numberOfPasswords"
            name="numberOfPasswords"
            min="1"
            max="100"
            value="10"
          />
        </label>
        <label for="languageSelect"
          >Language:
          <select id="languageSelect" name="languageSelect">
            <option value="en">English</option>
            <option value="nl" selected>Dutch</option>
          </select></label
        >
        <label for="forceCapital">
          <input type="checkbox" id="forceCapital" name="forceCapital" checked/> Force
          capitals</label
        >
        <label for="includeSpecialChars">
          <input
            type="checkbox"
            id="includeSpecialChars"
            name="includeSpecialChars" checked
          />
          Add special character</label
        >
        <label for="includeNumber">
          <input type="checkbox" id="includeNumber" name="includeNumber" checked/> Add
          number
        </label>
        <label for="specialsAtEnd">
          <input type="checkbox" id="specialsAtEnd" name="specialsAtEnd" checked/> Put
          special characters at the end
        </label>
        <button id="generateButton">Generate Passwords</button>
      </form>
      <div id="passwordDisplay"></div>
    </div>
    <p>
      Paswurdium is open source and freely available under the MIT License. Get
      the source at
      <a href="https://github.com/BraininaBowl/Paswurdium">GitHub</a>.
    </p>
  </body>
  <script src="buckets/adjectiveBucket.js"></script>
  <script src="buckets/adverbBucket.js"></script>
  <script src="buckets/articleBucket.js"></script>
  <script src="buckets/nounBucket.js"></script>
  <script src="buckets/numberBucket.js"></script>
  <script src="buckets/prepositionBucket.js"></script>
  <script src="buckets/seperatorBucket.js"></script>
  <script src="buckets/specialCharBucket.js"></script>
  <script src="buckets/temporalBucket.js"></script>
  <script src="buckets/verbBucket.js"></script>
  <script src="scripts/script.js"></script>
</html>
